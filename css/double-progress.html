            box-sizing: border-box;
            position: relative;
        }

        .ds-progress-wrap::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: calc(100% - 20px);
            height: 14px;
            background-color: #063a91;
            border-radius: 7px;
            transform: translate(-50%, -50%);
        }

        .ds-progress-item {
            height: 14px;
            border-radius: 7px;
            background-image: linear-gradient(90deg, #146ff9 0%, #14c8f9 100%);
            position: relative;
            z-index: 2;
        }

        .ds-progress-item+.ds-progress-item {
            margin-left: -10px;
            background-image: linear-gradient(90deg, #934eed 0%, #b956e8 100%);
            z-index: 1;
        }

        .ds-legend-wrap {
            display: flex;
            justify-content: flex-start;
            align-items: center;

        }

        .ds-legend-wrap .ds-legend-item {
            font-size: 14px;
            color: #4F99FF;

        }

        .ds-legend-wrap .ds-legend-item::before {
            content: "";
            width: 12px;
            height: 12px;
            display: inline-block;
            background: #14A7F9;
            margin-right: 4px;
        }

        .ds-legend-wrap .ds-legend-item+.ds-legend-item {
            margin-left: 70px;
        }

        .ds-legend-wrap .ds-legend-item+.ds-legend-item::before {
            background: #B658EA;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="main">
            <div class="ds-progress-wrap">
                <div class="ds-progress-item" style="width: 50%"></div>
                <div class="ds-progress-item" style="width: 30%"></div>
            </div>
            <div class="ds-legend-wrap">
                <div class="ds-legend-item">省内：18个</div>
                <div class="ds-legend-item">省外：2个</div>
            </div>
        </div>
    </div>
</body>
